services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build: .
    depends_on:
      - postgres
      - redis
      - kafka
      - minio
    environment:
      DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent
      REDIS_URL: redis://redis:6379/0
      RELIABILITY_STORE: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ARTIFACT_BASE_PATH: /data/artifacts
      ALLOWLIST_DOMAINS: example.com,example.org
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio12345
      MINIO_BUCKET: browser-agent
      TASK_CREATE_RATE_LIMIT_PER_MINUTE: 60
      IDEMPOTENCY_TTL_SECONDS: 86400
      TASK_LOCK_TTL_SECONDS: 300
      WORKER_SERVICE_ID: worker-local
      DLQ_TOPIC: agent.tasks.dlq
      BOOTSTRAP_KAFKA_TOPICS: "true"
    ports:
      - "8000:8000"
    volumes:
      - artifacts:/data/artifacts
    command: ["sh", "-c", "python scripts/bootstrap.py && uvicorn browser_agent.app:app --host 0.0.0.0 --port 8000"]

  worker:
    build: .
    depends_on:
      - postgres
      - redis
      - kafka
      - minio
    environment:
      DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent
      REDIS_URL: redis://redis:6379/0
      RELIABILITY_STORE: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ARTIFACT_BASE_PATH: /data/artifacts
      ALLOWLIST_DOMAINS: example.com,example.org
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio12345
      MINIO_BUCKET: browser-agent
      TASK_CREATE_RATE_LIMIT_PER_MINUTE: 60
      IDEMPOTENCY_TTL_SECONDS: 86400
      TASK_LOCK_TTL_SECONDS: 300
      WORKER_SERVICE_ID: worker-local
      DLQ_TOPIC: agent.tasks.dlq
      BOOTSTRAP_KAFKA_TOPICS: "true"
    volumes:
      - artifacts:/data/artifacts
    command: ["sh", "-c", "python scripts/bootstrap.py && python -m worker.consumer"]

volumes:
  pgdata:
  miniodata:
  artifacts:
