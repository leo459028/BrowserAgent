{{- if .Values.serviceMonitor.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "browser-agent.fullname" . }}-monitor
  labels:
    {{- include "browser-agent.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "browser-agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  endpoints:
    - port: http
      path: {{ .Values.serviceMonitor.path }}
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
