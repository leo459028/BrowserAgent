apiVersion: v1
kind: Secret
metadata:
  name: {{ include "browser-agent.fullname" . }}-secrets
  labels:
    {{- include "browser-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_SECRET_KEY: {{ .Values.secrets.appSecretKey | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.secrets.kafkaBootstrapServers | quote }}
  MINIO_ENDPOINT: {{ .Values.secrets.minioEndpoint | quote }}
  MINIO_ACCESS_KEY: {{ .Values.secrets.minioAccessKey | quote }}
  MINIO_SECRET_KEY: {{ .Values.secrets.minioSecretKey | quote }}
  KMS_MASTER_KEY: {{ .Values.secrets.kmsMasterKey | quote }}
