apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: browser-agent-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/leo459028/BrowserAgent.git
    targetRevision: feat/v1.3-release
    path: deploy/helm/browser-agent
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: browser-agent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
