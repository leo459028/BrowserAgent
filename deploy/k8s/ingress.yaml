apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: browseragent-ingress
  labels:
    app: browseragent
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
spec:
  rules:
    - host: agent.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: browseragent-api
                port:
                  number: 80
