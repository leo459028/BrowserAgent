apiVersion: v1
kind: Secret
metadata:
  name: browseragent-secrets
  labels:
    app: browseragent
type: Opaque
stringData:
  APP_SECRET_KEY: "replace-with-production-high-entropy-secret"
  AUTH_JWKS_URL: "https://auth.example.com/.well-known/jwks.json"
  MINIO_ACCESS_KEY: "minio-prod-access-key"
  MINIO_SECRET_KEY: "minio-prod-secret-key"
  ALERT_WEBHOOK_URL: "https://hooks.slack.com/services/PROD/CHANNEL/TOKEN"
