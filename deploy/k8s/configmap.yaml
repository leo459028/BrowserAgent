apiVersion: v1
kind: ConfigMap
metadata:
  name: browseragent-config
  labels:
    app: browseragent
data:
  APP_ENV: "production"
  APP_LOG_LEVEL: "INFO"
  AUTH_MODE: "jwks"
  AUTH_LOCAL_TOKENS_ENABLED: "false"
  RELIABILITY_STORE: "redis"
  ARTIFACT_BACKEND: "s3"
  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: "browser-agent"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4318/v1/traces"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.kafka.svc.cluster.local:9092"
  REDIS_URL: "redis://redis.storage.svc.cluster.local:6379/0"
  DATABASE_URL: "postgresql+psycopg://agent:agent@postgres.storage.svc.cluster.local:5432/agent"
  MINIO_ENDPOINT: "minio.storage.svc.cluster.local:9000"
  MINIO_BUCKET: "browser-agent"
  SCHEDULER_ENABLED: "true"
  WORKER_RECORD_VIDEO_DEFAULT: "false"
